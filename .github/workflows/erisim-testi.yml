# Elle çalıştırılan teşhis: sitelerin Actions IP'lerinden erişilebilir olup olmadığını raporlar.
name: Erişim testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python tools/erisim_testi.py
