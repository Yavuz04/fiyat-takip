# Kod değiştiğinde testleri çalıştırır. Botun durum commit'leri (data/) bunu tetiklemez.
name: Testler

on:
  push:
    paths: ["fiyatbot/**", "tests/**", "requirements*.txt", ".github/workflows/testler.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
